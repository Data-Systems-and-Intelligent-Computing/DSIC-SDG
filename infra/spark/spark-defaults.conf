# Points Spark at the REST catalog and the MinIO bucket the compose stack creates.
spark.sql.extensions                                   org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.kkciv                                org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.kkciv.type                           rest
spark.sql.catalog.kkciv.uri                            http://iceberg-rest:8181
spark.sql.catalog.kkciv.io-impl                        org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.kkciv.warehouse                      s3://kkciv-warehouse/
spark.sql.catalog.kkciv.s3.endpoint                    http://minio:9000
spark.sql.catalog.kkciv.s3.path-style-access           true
spark.sql.defaultCatalog                               kkciv
spark.driver.memory                                    2g
spark.driver.maxResultSize                             512m
