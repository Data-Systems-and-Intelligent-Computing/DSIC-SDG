[project]
name = "kkciv-vintage"
version = "0.1.0"
description = "Vintage-aware reconciliation of official SDG indicators"
requires-python = ">=3.11"

[project.scripts]
kkciv-h1 = "kkciv_vintage.h1.cli:main"
kkciv-h2 = "kkciv_vintage.h2.cli:main"
kkciv-h3 = "kkciv_vintage.h3.cli:main"
kkciv-h4 = "kkciv_vintage.h4.cli:main"
kkciv-h5 = "kkciv_vintage.h5.cli:main"
kkciv-h6 = "kkciv_vintage.h6.cli:main"
kkciv-h6b = "kkciv_vintage.h6b.cli:main"
kkciv-h6c = "kkciv_vintage.h6c.cli:main"
kkciv-h7 = "kkciv_vintage.h7.cli:main"
kkciv-h7b = "kkciv_vintage.h7b.cli:main"
kkciv-h7c = "kkciv_vintage.h7c.cli:main"
kkciv-h8 = "kkciv_vintage.h8.cli:main"
kkciv-h8b = "kkciv_vintage.h8b.cli:main"
kkciv-h8c = "kkciv_vintage.h8c.cli:main"
kkciv-h9 = "kkciv_vintage.h9.cli:main"
kkciv-h9c = "kkciv_vintage.h9c.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
