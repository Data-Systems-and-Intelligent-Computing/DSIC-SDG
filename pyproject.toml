[project]
name = "kkciv-vintage"
version = "0.1.0"
description = "Vintage-aware reconciliation of official SDG indicators"
requires-python = ">=3.11"

[project.scripts]
kkciv-h1 = "kkciv_vintage.h1.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
